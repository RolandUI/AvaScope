name: Release NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to NuGet.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Release NuGet Packages
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag version
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          [xml]$buildProps = Get-Content -LiteralPath .\Directory.Build.props
          $version = [string]$buildProps.Project.PropertyGroup.Version
          $tag = "${{ github.ref_name }}"
          $expectedTag = "v$version"

          if ($tag -ne $expectedTag) {
            throw "Release tag '$tag' does not match package version '$version'. Expected tag '$expectedTag'."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Create release artifacts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\create-local-release.ps1

      - name: Validate NuGet publish inputs
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-nuget.ps1 -DryRun

      - name: Publish NuGet packages
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: pwsh
        env:
          AVASCOPE_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-nuget.ps1
