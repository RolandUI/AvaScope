name: Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - Directory.Build.props
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages and GitHub Release assets.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-nuget-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Release NuGet Packages
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: release_metadata
        shell: pwsh
        run: |
          [xml]$buildProps = Get-Content -LiteralPath .\Directory.Build.props
          $version = [string]$buildProps.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props must define a non-empty Version."
          }

          $eventName = "${{ github.event_name }}"
          $publishInput = "${{ inputs.publish }}"
          $releaseTag = "v$version"

          $expectedTag = "v$version"
          if ($releaseTag -ne $expectedTag) {
            throw "Release tag '$releaseTag' does not match package version '$version'. Expected tag '$expectedTag'."
          }

          $remoteTag = git ls-remote --tags origin "refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect remote tag '$releaseTag'."
          }
          $tagExists = -not [string]::IsNullOrWhiteSpace(($remoteTag | Out-String).Trim())

          $manualPublish = $eventName -eq "workflow_dispatch" -and $publishInput -eq "true"
          $shouldPublish = if ($eventName -eq "push") { -not $tagExists } else { $manualPublish }
          $shouldValidate = $shouldPublish -or $eventName -eq "workflow_dispatch"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_validate=$($shouldValidate.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_publish=$($shouldPublish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Version: $version"
          Write-Host "Release tag: $releaseTag"
          Write-Host "Remote tag exists: $tagExists"
          Write-Host "Should validate: $shouldValidate"
          Write-Host "Should publish: $shouldPublish"

      - name: Setup .NET
        if: ${{ steps.release_metadata.outputs.should_validate == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release commit
        if: ${{ github.event_name == 'push' && steps.release_metadata.outputs.should_publish == 'true' }}
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\validate-release-commit.ps1 -Version "${{ steps.release_metadata.outputs.version }}"

      - name: Create release artifacts
        if: ${{ steps.release_metadata.outputs.should_validate == 'true' }}
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\create-local-release.ps1

      - name: Validate NuGet publish inputs
        if: ${{ steps.release_metadata.outputs.should_validate == 'true' }}
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-nuget.ps1 -DryRun

      - name: Validate GitHub Release assets
        if: ${{ steps.release_metadata.outputs.should_validate == 'true' }}
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-github-release.ps1 -Tag "${{ steps.release_metadata.outputs.release_tag }}" -DryRun

      - name: NuGet trusted publishing login
        if: ${{ steps.release_metadata.outputs.should_publish == 'true' }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: RolandUI

      - name: Publish nuget.org packages
        if: ${{ steps.release_metadata.outputs.should_publish == 'true' }}
        shell: pwsh
        env:
          AVASCOPE_NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-nuget.ps1 -SkipDuplicate

      - name: Publish GitHub Packages
        if: ${{ steps.release_metadata.outputs.should_publish == 'true' }}
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source `
            --username "${{ github.actor }}" `
            --password $env:GH_PACKAGES_TOKEN `
            --store-password-in-clear-text `
            --name github `
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-nuget.ps1 `
            -Source github `
            -ApiKey $env:GH_PACKAGES_TOKEN `
            -SkipDuplicate

      - name: Create release tag
        if: ${{ steps.release_metadata.outputs.should_publish == 'true' && steps.release_metadata.outputs.tag_exists == 'false' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release_metadata.outputs.release_tag }}" $env:GITHUB_SHA
          git push origin "refs/tags/${{ steps.release_metadata.outputs.release_tag }}"

      - name: Publish GitHub Release assets
        if: ${{ steps.release_metadata.outputs.should_publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\publish-github-release.ps1 -Tag "${{ steps.release_metadata.outputs.release_tag }}"

      - name: No release needed
        if: ${{ steps.release_metadata.outputs.should_validate != 'true' }}
        shell: pwsh
        run: Write-Host "Version ${{ steps.release_metadata.outputs.version }} is already released as ${{ steps.release_metadata.outputs.release_tag }}. No release action needed."
