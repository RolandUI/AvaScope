name: CI

on:
  workflow_dispatch:
    inputs:
      agent_qa_only:
        description: Run only the native agent QA lab after fixture/orchestration changes
        type: boolean
        default: false
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-qa-lab:
    name: Native agent QA lab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core libgtk-3-0
      - name: Build selected source and provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build AvaScope.slnx -c Release --nologo --disable-build-servers
          ./eng/package-provider.ps1
      - name: Validate native lifecycle and failure evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($IsLinux) {
            xvfb-run -a -s '-screen 0 1920x1200x24 -nolisten tcp' pwsh -NoProfile -File eng/test-agent-qa-lab.ps1 -SkipBuild -TestExpiry -OutputDirectory artifacts/agent-qa/ci
          } else {
            ./eng/test-agent-qa-lab.ps1 -SkipBuild -TestExpiry -OutputDirectory artifacts/agent-qa/ci
          }
      - name: Retain QA evidence (not a claim of agent exploration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-qa-lab-${{ runner.os }}
          retention-days: 14
          path: |
            artifacts/agent-qa/ci/**
            !artifacts/agent-qa/ci/**/tools/**
            !artifacts/agent-qa/ci/**/host/**
            !artifacts/agent-qa/ci/**/client/**
            !artifacts/agent-qa/ci/**/provider/**
            !artifacts/agent-qa/ci/**/build-host/**

  validate:
    if: ${{ !inputs.agent_qa_only }}
    name: Build, Test, Pack
    runs-on: windows-latest
    outputs:
      requires_validation: ${{ steps.changes.outputs.requires_validation }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changes
        id: changes
        shell: pwsh
        run: |
          function Test-DocumentationOnlyPath {
            param([Parameter(Mandatory = $true)][string]$Path)

            $normalized = $Path.Replace('\', '/')
            return $normalized.StartsWith('docs/', [System.StringComparison]::OrdinalIgnoreCase) `
              -or $normalized.EndsWith('.md', [System.StringComparison]::OrdinalIgnoreCase)
          }

          $eventName = "${{ github.event_name }}"
          $head = $env:GITHUB_SHA
          $base = "${{ github.event.before }}"
          if ($eventName -eq 'pull_request') {
            $base = 'HEAD^1'
            $head = 'HEAD'
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $changed = @(git diff-tree --no-commit-id --name-only -r $head)
          }
          else {
            $changed = @(git diff --name-only $base $head)
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Could not determine changed files for CI validation scope."
          }

          $changed = @($changed | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $nonDocumentation = @($changed | Where-Object { -not (Test-DocumentationOnlyPath $_) })
          $docsOnly = $eventName -ne 'workflow_dispatch' -and $changed.Count -gt 0 -and $nonDocumentation.Count -eq 0
          $requiresValidation = -not $docsOnly

          "docs_only=$($docsOnly.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "requires_validation=$($requiresValidation.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Changed files:"
          foreach ($path in $changed) {
            Write-Host "  $path"
          }

          Write-Host "Documentation only: $docsOnly"
          Write-Host "Requires full validation: $requiresValidation"

          "## CI validation scope" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Documentation only: ``$($docsOnly.ToString().ToLowerInvariant())``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Requires full validation: ``$($requiresValidation.ToString().ToLowerInvariant())``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Changed files:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($path in $changed) {
            "- ``$path``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Setup .NET
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        run: dotnet restore AvaScope.slnx

      - name: Build
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        run: dotnet build AvaScope.slnx -c Release --no-restore

      - name: Test
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        run: dotnet test AvaScope.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results/windows

      - name: Validate source complex workflows through CLI and MCP
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 `
            -CliAssembly ./src/AvaScope.Cli/bin/Release/net10.0/avascope.dll `
            -Surface Cli `
            -Configuration Release
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 `
            -CliAssembly ./src/AvaScope.Cli/bin/Release/net10.0/avascope.dll `
            -Surface Mcp `
            -McpAssembly ./src/AvaScope.Mcp/bin/Release/net10.0/AvaScope.Mcp.dll `
            -McpScenarioClientAssembly ./tests/AvaScope.McpScenarioClient/bin/Release/net10.0/AvaScope.McpScenarioClient.dll `
            -Configuration Release

      - name: Pack libraries
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet pack src\AvaScope.Protocol\AvaScope.Protocol.csproj -c Release --no-build --output artifacts\packages
          dotnet pack src\AvaScope.Core\AvaScope.Core.csproj -c Release --no-build --output artifacts\packages
          dotnet pack src\AvaScope.Bridge\AvaScope.Bridge.csproj -c Release --no-build --output artifacts\packages
          Get-ChildItem artifacts\packages

      - name: Package executables
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\package-executables.ps1
          Get-ChildItem artifacts\executables

      - name: Test packaged Windows lifecycle scenario
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/test-packaged-lifecycle.ps1 -CliAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/avascope.dll -Configuration Release

      - name: Test packaged Windows complex workflows through CLI and MCP
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 `
            -CliAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/avascope.dll `
            -Surface Cli `
            -Configuration Release
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 `
            -CliAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/avascope.dll `
            -Surface Mcp `
            -McpAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/AvaScope.Mcp.dll `
            -McpScenarioClientAssembly ./tests/AvaScope.McpScenarioClient/bin/Release/net10.0/AvaScope.McpScenarioClient.dll `
            -Configuration Release

      - name: Install Inno Setup
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup -e --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Package installers
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\package-installers.ps1
          Get-Item artifacts\executables\AvaScopeSetup.exe
          Get-Item artifacts\executables\avascope-linux-x64-installer
          Get-Item artifacts\executables\avascope-osx-arm64-installer
          Get-Item artifacts\executables\avascope-osx-x64-installer

      - name: Test packaged Windows installer
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        env:
          AVASCOPE_INSTALLER_ARTIFACT: ${{ github.workspace }}/artifacts/executables/AvaScopeSetup.exe
        run: dotnet test AvaScope.slnx -c Release --no-build --filter FullyQualifiedName~PackagedInstallerSupportsInstallRepairDoctorMcpAndUninstall

      - name: Verify artifacts
        if: ${{ steps.changes.outputs.requires_validation == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\package-provider.ps1
          pwsh -NoProfile -File .\eng\test-standalone-provider.ps1 -Native -SkipBuild
          pwsh -NoProfile -File .\eng\test-integration-onboarding.ps1 -Native -SkipBuild -SummaryPath artifacts/onboarding-validation/recipe-source.json
          pwsh -NoProfile -File .\eng\test-agent-recipes.ps1 -Native -SkipBuild -OnboardingReport artifacts/onboarding-validation/recipe-source.json
          pwsh -NoProfile -File .\eng\test-target-readiness.ps1
          pwsh -NoProfile -File .\eng\test-native-input.ps1
          pwsh -NoProfile -File .\eng\test-native-platform-matrix.ps1 -Backend headless -CliAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/avascope.dll -McpAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/AvaScope.Mcp.dll
          pwsh -NoProfile -File .\eng\test-native-platform-matrix.ps1 -Backend win32 -CliAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/avascope.dll -McpAssembly ./artifacts/executables/avascope-win-x64-framework-dependent/AvaScope.Mcp.dll
          powershell -NoProfile -ExecutionPolicy Bypass -File .\eng\verify-artifacts.ps1
          Get-Content artifacts\release-manifest.json

      - name: Skip .NET validation
        if: ${{ steps.changes.outputs.requires_validation != 'true' }}
        shell: pwsh
        run: Write-Host "Only documentation files changed; skipped Restore, Build, Test, Pack, and artifact verification."

      - name: Preserve provider and onboarding diagnostics
        if: ${{ always() && steps.changes.outputs.requires_validation == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-foundation-windows
          retention-days: 7
          path: |
            artifacts/test-results/windows/**/*.trx
            artifacts/provider-validation/**/*.log
            artifacts/provider-validation/**/cli-*.json
            artifacts/provider-validation/**/mcp-*.json
            artifacts/provider-validation/**/validation.json
            artifacts/onboarding-validation/**/*.log
            artifacts/onboarding-validation/**/validation.json
            artifacts/agent-evaluations/*/evaluation*.json
            artifacts/agent-evaluations/*/tool-events.jsonl
            artifacts/agent-evaluations/*/result-*.json
            artifacts/agent-evaluations/*/evidence/*/workflow/reports/*
            artifacts/agent-evaluations/*/evidence/*/workflow/failures/**
            artifacts/readiness-validation/**/*.json
            artifacts/native-input/**/evidence/**
            artifacts/native-input/**/test.log
            artifacts/platform-matrix/**/validation.json
            artifacts/platform-matrix/**/*-result.json
            artifacts/platform-matrix/**/*.log
            artifacts/platform-matrix/**/evidence/**/*.json
            artifacts/platform-matrix/**/evidence/**/*.md
            artifacts/platform-matrix/**/evidence/**/*.xml
            artifacts/platform-matrix/**/evidence/**/*.png

  installer-linux:
    name: Linux Installer
    needs: validate
    if: ${{ needs.validate.outputs.requires_validation == 'true' }}
    # Weston 13 is the validated controlled Wayland prerequisite on Ubuntu 24.04.
    runs-on: ubuntu-24.04

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      AVASCOPE_INSTALLER_ARTIFACT: ${{ github.workspace }}/artifacts/executables/avascope-linux-x64-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AvaScope.slnx

      - name: Build
        run: dotnet build AvaScope.slnx -c Release --no-restore

      - name: Package Linux executable
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/package-executables.ps1 -RuntimeIdentifiers linux-x64

      - name: Validate standalone provider on Linux X11
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils openbox dbus at-spi2-core weston wayland-utils xkb-data libegl-mesa0 libgl1-mesa-dri libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core libgtk-3-0
          AVASCOPE_RECOVERY_MANAGED_X11=1 AVASCOPE_VALIDATION_EVIDENCE_ROOT="$GITHUB_WORKSPACE/artifacts/x11-unit" dotnet test AvaScope.slnx -c Release --no-build --filter 'FullyQualifiedName~X11TestEnvironmentTests|FullyQualifiedName~WaylandTestEnvironmentTests|FullyQualifiedName~AgentRunRecoveryTests|FullyQualifiedName~SessionControlTests|FullyQualifiedName~RuntimeScenarioLifecycleTests'
          pwsh -NoProfile -File ./eng/package-provider.ps1
          pwsh -NoProfile -File ./eng/test-managed-x11.ps1
          pwsh -NoProfile -File ./eng/test-managed-wayland.ps1 -CliAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/avascope.dll -McpAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/AvaScope.Mcp.dll
          pwsh -NoProfile -File ./eng/test-native-input.ps1
          pwsh -NoProfile -File ./eng/test-native-platform-matrix.ps1 -Backend x11 -CliAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/avascope.dll -McpAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/AvaScope.Mcp.dll
          xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" pwsh -NoProfile -File ./eng/test-standalone-provider.ps1 -Native -SkipBuild
          xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" pwsh -NoProfile -File ./eng/test-integration-onboarding.ps1 -Native -SkipBuild -SummaryPath artifacts/onboarding-validation/recipe-source.json
          xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" pwsh -NoProfile -File ./eng/test-agent-recipes.ps1 -Native -SkipBuild -OnboardingReport artifacts/onboarding-validation/recipe-source.json
          xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" pwsh -NoProfile -File ./eng/test-target-readiness.ps1

      - name: Test packaged Linux lifecycle scenario
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/test-packaged-lifecycle.ps1 -CliAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/avascope.dll -Configuration Release

      - name: Test packaged Linux complex workflows through CLI and MCP
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 `
            -CliAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/avascope.dll `
            -Surface Cli `
            -Configuration Release
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 `
            -CliAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/avascope.dll `
            -Surface Mcp `
            -McpAssembly ./artifacts/executables/avascope-linux-x64-framework-dependent/AvaScope.Mcp.dll `
            -McpScenarioClientAssembly ./tests/AvaScope.McpScenarioClient/bin/Release/net10.0/AvaScope.McpScenarioClient.dll `
            -Configuration Release

      - name: Package Linux installer
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/package-installers.ps1 -RuntimeIdentifiers linux-x64

      - name: Test packaged Linux installer
        run: |
          expected_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          bash ./eng/test-linux-installer.sh "$AVASCOPE_INSTALLER_ARTIFACT" "$expected_version"
          dotnet test AvaScope.slnx -c Release --no-build --filter FullyQualifiedName~PackagedInstallerSupportsInstallRepairDoctorMcpAndUninstall

      - name: Preserve provider and onboarding diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-foundation-linux
          retention-days: 7
          path: |
            artifacts/provider-validation/**/*.log
            artifacts/provider-validation/**/cli-*.json
            artifacts/provider-validation/**/mcp-*.json
            artifacts/provider-validation/**/validation.json
            artifacts/onboarding-validation/**/*.log
            artifacts/onboarding-validation/**/validation.json
            artifacts/agent-evaluations/*/evaluation*.json
            artifacts/agent-evaluations/*/tool-events.jsonl
            artifacts/agent-evaluations/*/result-*.json
            artifacts/agent-evaluations/*/evidence/*/workflow/reports/*
            artifacts/agent-evaluations/*/evidence/*/workflow/failures/**
            artifacts/readiness-validation/**/*.json
            artifacts/native-input/**/evidence/**
            artifacts/native-input/**/test.log
            artifacts/platform-matrix/**/validation.json
            artifacts/platform-matrix/**/*-result.json
            artifacts/platform-matrix/**/*.log
            artifacts/platform-matrix/**/evidence/**/*.json
            artifacts/platform-matrix/**/evidence/**/*.md
            artifacts/platform-matrix/**/evidence/**/*.xml
            artifacts/platform-matrix/**/evidence/**/*.png
            artifacts/x11-validation/**/*.log
            artifacts/x11-validation/**/environment.json
            artifacts/x11-validation/**/validation.json
            artifacts/x11-validation/**/cli.json
            artifacts/x11-validation/**/mcp.json
            artifacts/x11-unit/**/*.log
            artifacts/x11-unit/**/environment.json
            artifacts/wayland-validation/**/*.log
            artifacts/wayland-validation/**/validation.json
            artifacts/wayland-validation/**/environment.json
            artifacts/wayland-validation/*/cli-*.json
            artifacts/wayland-validation/*/mcp-*.json
            artifacts/wayland-validation/**/workflow/**/*.png

  macos-runtime:
    name: macOS Runtime
    needs: validate
    if: ${{ needs.validate.outputs.requires_validation == 'true' }}
    runs-on: macos-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AvaScope.slnx

      - name: Build
        run: dotnet build AvaScope.slnx -c Release --no-restore

      - name: Test
        run: dotnet test AvaScope.slnx -c Release --no-build

      - name: Validate macOS runtime and preview workflows
        run: bash ./eng/test-macos-runtime.sh Release

      - name: Package and validate native macOS artifact
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) runtime_identifier="osx-arm64" ;;
            x86_64) runtime_identifier="osx-x64" ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          pwsh -NoProfile -File ./eng/package-executables.ps1 -RuntimeIdentifiers "$runtime_identifier"
          pwsh -NoProfile -File ./eng/test-packaged-lifecycle.ps1 \
            -CliAssembly "./artifacts/executables/avascope-$runtime_identifier-framework-dependent/avascope.dll" \
            -Configuration Release
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 \
            -CliAssembly "./artifacts/executables/avascope-$runtime_identifier-framework-dependent/avascope.dll" \
            -Surface Cli \
            -Configuration Release
          pwsh -NoProfile -File ./eng/test-complex-workflow.ps1 \
            -CliAssembly "./artifacts/executables/avascope-$runtime_identifier-framework-dependent/avascope.dll" \
            -Surface Mcp \
            -McpAssembly "./artifacts/executables/avascope-$runtime_identifier-framework-dependent/AvaScope.Mcp.dll" \
            -McpScenarioClientAssembly ./tests/AvaScope.McpScenarioClient/bin/Release/net10.0/AvaScope.McpScenarioClient.dll \
            -Configuration Release
          pwsh -NoProfile -File ./eng/package-installers.ps1 -RuntimeIdentifiers "$runtime_identifier"
          dotnet pack src/AvaScope.Protocol/AvaScope.Protocol.csproj -c Release --no-build --output artifacts/packages
          dotnet pack src/AvaScope.Core/AvaScope.Core.csproj -c Release --no-build --output artifacts/packages
          dotnet pack src/AvaScope.Bridge/AvaScope.Bridge.csproj -c Release --no-build --output artifacts/packages
          pwsh -NoProfile -File ./eng/package-provider.ps1
          pwsh -NoProfile -File ./eng/test-standalone-provider.ps1 -Native -SkipBuild
          pwsh -NoProfile -File ./eng/test-integration-onboarding.ps1 -Native -SkipBuild -SummaryPath artifacts/onboarding-validation/recipe-source.json
          pwsh -NoProfile -File ./eng/test-agent-recipes.ps1 -Native -SkipBuild -OnboardingReport artifacts/onboarding-validation/recipe-source.json
          pwsh -NoProfile -File ./eng/test-target-readiness.ps1
          pwsh -NoProfile -File ./eng/test-native-input.ps1
          pwsh -NoProfile -File ./eng/test-native-platform-matrix.ps1 -Backend macos -CliAssembly "./artifacts/executables/avascope-$runtime_identifier-framework-dependent/avascope.dll" -McpAssembly "./artifacts/executables/avascope-$runtime_identifier-framework-dependent/AvaScope.Mcp.dll"
          pwsh -NoProfile -File ./eng/verify-artifacts.ps1 \
            -ExecutableRuntimeIdentifiers "$runtime_identifier" \
            -InstallerRuntimeIdentifiers "$runtime_identifier"
          expected_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          bash ./eng/test-macos-artifact.sh \
            "artifacts/executables/avascope-$runtime_identifier-framework-dependent.zip" \
            "$expected_version" \
            Release
          AVASCOPE_INSTALLER_ARTIFACT="$GITHUB_WORKSPACE/artifacts/executables/avascope-$runtime_identifier-installer" \
            dotnet test AvaScope.slnx \
              -c Release \
              --no-build \
              --filter FullyQualifiedName~PackagedInstallerSupportsInstallRepairDoctorMcpAndUninstall
          bash ./eng/test-macos-packaged-workflow.sh \
            "artifacts/executables/avascope-$runtime_identifier-installer" \
            artifacts/release-manifest.json \
            Release

      - name: Preserve provider and onboarding diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-foundation-macos
          retention-days: 7
          path: |
            artifacts/provider-validation/**/*.log
            artifacts/provider-validation/**/cli-*.json
            artifacts/provider-validation/**/mcp-*.json
            artifacts/provider-validation/**/validation.json
            artifacts/onboarding-validation/**/*.log
            artifacts/onboarding-validation/**/validation.json
            artifacts/agent-evaluations/*/evaluation*.json
            artifacts/agent-evaluations/*/tool-events.jsonl
            artifacts/agent-evaluations/*/result-*.json
            artifacts/agent-evaluations/*/evidence/*/workflow/reports/*
            artifacts/agent-evaluations/*/evidence/*/workflow/failures/**
            artifacts/readiness-validation/**/*.json
            artifacts/native-input/**/evidence/**
            artifacts/native-input/**/test.log
            artifacts/platform-matrix/**/validation.json
            artifacts/platform-matrix/**/*-result.json
            artifacts/platform-matrix/**/*.log
