name: Showcase

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_HTML_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R website/. _site/

          if [[ -z "${RELEASE_TAG_NAME}" ]]; then
            latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            release_tag="$(jq -r '.tag_name' <<<"${latest_release}")"
            release_published_at="$(jq -r '.published_at' <<<"${latest_release}")"
            release_html_url="$(jq -r '.html_url' <<<"${latest_release}")"
          else
            release_tag="${RELEASE_TAG_NAME}"
            release_published_at="${RELEASE_PUBLISHED_AT}"
            release_html_url="${RELEASE_HTML_URL}"
          fi

          jq -n \
            --arg tagName "${release_tag}" \
            --arg publishedAt "${release_published_at}" \
            --arg releaseUrl "${release_html_url}" \
            '{tagName: $tagName, publishedAt: $publishedAt, releaseUrl: $releaseUrl}' \
            > _site/release.json

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/release.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy showcase
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
