name: Bug
description: Report or track a defect.
title: "[Bug] "
labels:
  - type:bug
  - status:backlog
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands, project shape, or logs that reproduce the issue.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Tests or commands that should prove the fix.
    validations:
      required: false
